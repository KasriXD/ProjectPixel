name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            configure: dev
            build: dev
            test: dev
            cc: gcc-13
            cxx: g++-13
          - name: Linux Clang
            os: ubuntu-24.04
            configure: dev
            build: dev
            test: dev
            cc: clang-18
            cxx: clang++-18
          - name: Linux ASan+UBSan
            os: ubuntu-24.04
            configure: asan
            build: asan
            test: asan
            cc: gcc-13
            cxx: g++-13
          - name: Linux headless (no SDL)
            os: ubuntu-24.04
            configure: headless
            build: headless
            test: headless
            cc: gcc-13
            cxx: g++-13
          - name: Windows MSVC
            os: windows-2022
            configure: windows
            build: windows-debug
            test: windows-debug
          - name: macOS Apple Clang
            os: macos-15  # GitHub stopped accepting macos-14 (seen 2026-11-06)
            configure: dev
            build: dev
            test: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: cmake --preset ${{ matrix.configure }} 2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.build }} --parallel 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.test }} 2>&1 | tee test.log

      # The launcher against a real platform: logging in, every page, playing
      # and joining a friend from it, inviting from a game (docs/launcher.md).
      - name: Launcher with a platform
        if: matrix.name == 'Linux GCC'
        shell: bash
        run: |
          set +e
          tools/launcher/launcher_check.sh build/dev launcher-run > launcher-check.log 2>&1
          status=$?
          cat launcher-check.log
          body=$(tail -c 6000 launcher-check.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          if [ $status -ne 0 ]; then echo "::error title=Launcher check::${body}"; exit 1; fi
          echo "::notice title=Launcher check::${body}"

      # Game traffic is encrypted: packets of a real game captured on the
      # loopback interface carry neither the player's nor the game's name.
      - name: Encrypted game traffic on the wire
        if: matrix.name == 'Linux GCC'
        shell: bash
        run: |
          set +e
          sudo python3 tools/net/capture_check.py build/dev examples/platformer > capture-check.log 2>&1
          status=$?
          cat capture-check.log
          body=$(tail -c 3000 capture-check.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          if [ $status -ne 0 ]; then echo "::error title=Encrypted traffic::${body}"; exit 1; fi
          echo "::notice title=Encrypted traffic::${body}"

      - name: Upload launcher results
        if: always() && matrix.name == 'Linux GCC'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-run
          path: |
            launcher-run/*.png
            launcher-run/*.log
          if-no-files-found: ignore

      # Publishes the end of the CMake/CTest logs as annotations, so failures
      # can be read through the GitHub API without downloading job logs.
      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          annotate() {
            local title="$1" file="$2"
            [ -f "$file" ] || return 0
            local body
            body=$(tail -c 6000 "$file" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${title}::${body}"
          }
          annotate "Configure output" configure.log
          if [ -f build.log ]; then grep -E "error|FAILED" build.log | tail -40 > build-errors.log || true; fi
          annotate "Build errors" build-errors.log
          annotate "Test output" test.log
          if [ -f test.log ]; then
            grep -E "ERROR:|FAILED|Failed|test cases:|assertions:|tests passed|\.cpp(:|\()" test.log | head -60 > test-summary.log || true
            annotate "Test summary" test-summary.log
          fi

      # Which tests ran and passed, readable through the GitHub API.
      - name: Report test results
        if: success()
        shell: bash
        run: |
          if [ -f test.log ]; then
            body=$(grep -E "Test +#|tests passed" test.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=Tests::${body}"
          fi

      - name: Upload smoke-test screenshots
        if: always() && matrix.configure != 'headless'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}-${{ matrix.configure }}-${{ strategy.job-index }}
          path: |
            build/${{ matrix.configure }}/tests/player_smoke.png
            build/${{ matrix.configure }}/tests/launcher_smoke.png
            build/${{ matrix.configure }}/tests/studio_smoke.png
          if-no-files-found: ignore

  # Experimental: proves the engine, Luau and SDL3 build for the browser.
  # Does not block merges until the browser runtime is a supported target.
  wasm:
    name: WebAssembly (experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      EMSDK_VERSION: "6.0.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Engine and tests under Node.js
        shell: bash
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --preset wasm-headless 2>&1 | tee configure.log
          cmake --build --preset wasm-headless --parallel 2>&1 | tee build.log
          ctest --preset wasm-headless 2>&1 | tee test.log
          node build/wasm-headless/apps/headless/px-headless.js examples/platformer \
            --input-script examples/platformer/tests/full_run.input --expect-level-complete \
            --expect-no-script-errors 2>&1 | tee -a test.log

      - name: Browser player
        shell: bash
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cmake --preset wasm 2>&1 | tee -a configure.log
          cmake --build --preset wasm --parallel 2>&1 | tee -a build.log
          sizes=$(ls -l build/wasm/apps/player/px-player.* | awk '{printf "%s: %d KiB. ", $9, $5/1024}')
          echo "::notice title=Browser build::${sizes}"

      - name: Play the browser build in headless Chromium
        shell: bash
        run: |
          set +e
          report() { # title, file
            local body
            body=$(tail -c 6000 "$2" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::$3 title=$1::${body}"
          }
          {
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pil &&
            (cd tools/browser && npm install --no-save --no-audit --no-fund playwright@1.49.1 &&
             npx playwright install --with-deps chromium)
          } > browser-setup.log 2>&1
          if [ $? -ne 0 ]; then report "Browser test setup failed" browser-setup.log error; exit 1; fi

          (cd build/wasm/apps/player && python3 -m http.server 8000 > /dev/null 2>&1 &)
          sleep 2
          args="arg=--frames&arg=930&arg=--input-script&arg=/examples/platformer/tests/full_run.input"
          node tools/browser/smoke_test.js "http://localhost:8000/px-player.html?${args}" browser.png > browser.log 2>&1
          status=$?
          cat browser.log
          if [ -f browser.png ]; then python3 tools/browser/ascii_screenshot.py browser.png >> browser.log 2>&1; fi
          report "Browser run (headless Chromium)" browser.log notice
          exit $status

      - name: Report failure details
        if: failure()
        shell: bash
        run: |
          annotate() {
            local title="$1" file="$2"
            [ -f "$file" ] || return 0
            local body
            body=$(tail -c 6000 "$file" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${title}::${body}"
          }
          annotate "Configure output" configure.log
          if [ -f build.log ]; then grep -E "error|FAILED" build.log | tail -40 > build-errors.log || true; fi
          annotate "Build errors" build-errors.log
          annotate "Test output" test.log
          if [ -f test.log ]; then
            grep -E "ERROR:|FAILED|Failed|test cases:|assertions:|tests passed|\.cpp(:|\()" test.log | head -60 > test-summary.log || true
            annotate "Test summary" test-summary.log
          fi

      - name: Upload browser build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: px-player-web
          path: |
            browser.png
            build/wasm/apps/player/px-player.html
            build/wasm/apps/player/px-player.js
            build/wasm/apps/player/px-player.wasm
            build/wasm/apps/player/px-player.data

  crossplay:
    name: Browser cross-play
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Platform, server and bot (headless build)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake --preset headless 2>&1 | tee configure.log
          cmake --build --preset headless --parallel --target px_platform px_server px_headless 2>&1 | tee build.log

      - name: Browser player from the WebAssembly job
        uses: actions/download-artifact@v4
        with:
          name: px-player-web
          path: web-download

      - name: Headless Chromium
        shell: bash
        run: |
          cd tools/browser
          npm install --no-save --no-audit --no-fund playwright@1.49.1 > ../../browser-setup.log 2>&1
          npx playwright install --with-deps chromium >> ../../browser-setup.log 2>&1

      - name: Play together over HTTP and HTTPS
        shell: bash
        run: |
          set +e
          report() { # title, file, level
            local body
            body=$(tail -c 6000 "$2" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::$3 title=$1::${body}"
          }
          web=web-download/build/wasm/apps/player
          failed=0
          for mode in http https; do
            tools/browser/crossplay.sh build/headless "$web" crossplay "$mode" > "crossplay-$mode.log" 2>&1
            status=$?
            cat "crossplay-$mode.log"
            if [ $status -ne 0 ]; then
              report "Cross-play over $mode failed" "crossplay-$mode.log" error
              failed=1
            else
              grep -E "PASSED|Finished|^bot:" "crossplay-$mode.log" > "crossplay-$mode-summary.log"
              report "Cross-play over $mode" "crossplay-$mode-summary.log" notice
            fi
          done
          exit $failed

      # The page's social side with the real player: pictures, a game's page
      # and leaderboards, friends, the profile, joining a friend and inviting
      # one (docs/launcher.md#the-browser), on a computer and a phone screen.
      - name: Friends and leaderboards in the browser
        shell: bash
        run: |
          set +e
          web=web-download/build/wasm/apps/player
          picture=web-download/browser.png
          [ -f "$picture" ] || picture=
          failed=0
          for screen in desktop phone; do
            tools/browser/social_test.sh build/headless "$web" "social-$screen" "$screen" $picture > "social-$screen.log" 2>&1
            status=$?
            cat "social-$screen.log"
            body=$(tail -c 6000 "social-$screen.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            if [ $status -ne 0 ]; then echo "::error title=Social page ($screen)::${body}"; failed=1;
            else echo "::notice title=Social page ($screen)::${body}"; fi
          done
          exit $failed

      # Accounts on the page (which runs without a browser player here): an
      # address confirmed from the mail, changing and resetting the password,
      # downloading the data and deleting the account (docs/accounts.md). The
      # mail goes into files, and through a real SMTP server that insists on
      # STARTTLS (aiosmtpd, with a development certificate).
      - name: Accounts in the browser
        shell: bash
        run: |
          set +e
          python3 -m pip install --break-system-packages --quiet aiosmtpd==1.4.6 > accounts-setup.log 2>&1 ||
            { cat accounts-setup.log; exit 1; }
          failed=0
          for run in "files desktop" "smtp phone"; do
            set -- $run
            tools/browser/accounts_test.sh build/headless "accounts-$1-$2" "$1" "$2" > "accounts-$1-$2.log" 2>&1
            status=$?
            cat "accounts-$1-$2.log"
            body=$(tail -c 6000 "accounts-$1-$2.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            if [ $status -ne 0 ]; then echo "::error title=Accounts page ($1, $2)::${body}"; failed=1;
            else echo "::notice title=Accounts page ($1, $2)::${body}"; fi
          done
          exit $failed

      - name: Upload cross-play results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossplay
          path: |
            crossplay-*.log
            crossplay/*.png
            crossplay/*.log
            social-*.log
            social-*/*.png
            social-*/*.log
            accounts-*.log
            accounts-*/*.png
            accounts-*/*.log

  android:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: The game the app plays
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          cmake -S . -B build/pack -G Ninja -DCMAKE_BUILD_TYPE=Release -DPX_BUILD_CLIENT=OFF \
            -DPX_BUILD_TESTS=OFF -DPX_ENABLE_PLATFORM=OFF > pack.log 2>&1
          cmake --build build/pack --target px_headless >> pack.log 2>&1 || { tail -40 pack.log; exit 1; }
          build/pack/apps/headless/px-headless examples/platformer --pack "$GITHUB_WORKSPACE/game.pxpkg"

      - name: Android NDK and CMake
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          cmake=$("$sdkmanager" --list 2>/dev/null | grep -o 'cmake;3\.[0-9.]*' | cut -d';' -f2 | sort -uV | tail -1)
          ndk=$(basename "$ANDROID_NDK_LATEST_HOME")
          echo "NDK $ndk, CMake $cmake"
          set +o pipefail # yes stops with "broken pipe" when sdkmanager is done
          yes 2> /dev/null | "$sdkmanager" --install "cmake;$cmake" > /dev/null
          test -x "$ANDROID_HOME/cmake/$cmake/bin/cmake" || { echo "CMake $cmake did not install"; exit 1; }
          echo "PX_NDK=$ndk" >> "$GITHUB_ENV"
          echo "PX_CMAKE=$cmake" >> "$GITHUB_ENV"

      - name: Build the APK
        shell: bash
        working-directory: platforms/android
        run: |
          gradle assembleRelease --no-daemon -PpxGamePackage="$GITHUB_WORKSPACE/game.pxpkg" \
            -PpxNdkVersion="$PX_NDK" -PpxCmakeVersion="$PX_CMAKE" 2>&1 | tee build.log
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { grep -E "error|FAILED|What went wrong" -A5 build.log | head -60; exit 1; }
          unzip -l "$apk" | grep -E "libmain.so|game.pxpkg|classes.dex"
          echo "::notice title=Android app::$(du -k "$apk" | cut -f1) KiB, ABIs: $(unzip -l "$apk" | grep -o 'lib/[^/]*/libmain.so' | cut -d/ -f2 | tr '\n' ' ')"
          cp "$apk" "$GITHUB_WORKSPACE/pixel-player.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: pixel-player.apk

  android-emulator:
    name: Android app (emulator)
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulated phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: tools/android/emulator_check.sh pixel-player.apk android-run

      - name: What the screen showed
        if: always()
        run: |
          # (Only a look at the screenshots: nothing here fails the job.)
          python3 -c "import PIL" 2> /dev/null ||
            python3 -m pip install --break-system-packages --quiet pillow > /dev/null 2>&1 || true
          for shot in android-run/android-launcher.png android-run/android-game.png android-run/android-menu.png; do
            if [ -f "$shot" ]; then echo "== $shot"; python3 tools/browser/ascii_screenshot.py "$shot" || true; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-run
          path: android-run/

  ios:
    name: iOS app (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The game the app plays
        shell: bash
        run: |
          cmake -S . -B build/pack -DCMAKE_BUILD_TYPE=Release -DPX_BUILD_CLIENT=OFF -DPX_BUILD_TESTS=OFF \
            -DPX_ENABLE_PLATFORM=OFF > pack.log 2>&1
          cmake --build build/pack --target px_headless --parallel >> pack.log 2>&1 || { tail -40 pack.log; exit 1; }
          build/pack/apps/headless/px-headless examples/platformer --pack "$GITHUB_WORKSPACE/game.pxpkg"

      - name: Build the app
        shell: bash
        run: |
          cmake -S . -B build/ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DPX_BUILD_STUDIO=OFF -DPX_BUILD_TESTS=OFF \
            -DPX_GAME_PACKAGE="$GITHUB_WORKSPACE/game.pxpkg" > configure.log 2>&1 || { tail -60 configure.log; exit 1; }
          cmake --build build/ios --config Release --target px_player -- -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO -quiet > build.log 2>&1 || { grep -E "error|BUILD FAILED" build.log | head -60; exit 1; }
          app=$(find build/ios -name "px-player.app" -type d -path "*iphonesimulator*" | head -1)
          test -n "$app" || { echo "no px-player.app"; exit 1; }
          ls "$app"
          echo "PX_APP=$app" >> "$GITHUB_ENV"

      - name: Run it in the simulator
        shell: bash
        run: |
          set +e
          device=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $(xcrun simctl list devices available | grep "$device")"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b > /dev/null
          xcrun simctl install "$device" "$PX_APP"
          xcrun simctl launch --console-pty "$device" dev.px.player --frames 900 > simulator.log 2>&1 &
          sleep 12
          xcrun simctl io "$device" screenshot simulator.png
          for _ in $(seq 1 60); do grep -q "Finished" simulator.log && break; sleep 1; done
          cat simulator.log
          grep -q "Finished 900 frames" simulator.log || { echo "::error title=iOS simulator::the app did not finish its run"; exit 1; }
          echo "::notice title=iOS simulator::$(grep Finished simulator.log)"
          # Started without a game: the launcher.
          xcrun simctl launch --console-pty "$device" dev.px.player > launcher.log 2>&1 &
          sleep 12
          xcrun simctl io "$device" screenshot simulator-launcher.png
          xcrun simctl terminate "$device" dev.px.player
          sleep 2
          cat launcher.log
          grep -q "Launcher open" launcher.log || { echo "::error title=iOS simulator::the launcher did not open"; exit 1; }
          # Launcher -> the game on this device -> back to the launcher, in one window.
          xcrun simctl launch --console-pty "$device" dev.px.player --launcher --open local:0 --frames 300 > roundtrip.log 2>&1 &
          for _ in $(seq 1 90); do grep -q "Launcher finished" roundtrip.log && break; sleep 1; done
          cat roundtrip.log
          grep -q "Launcher finished" roundtrip.log || { echo "::error title=iOS simulator::the game did not go back to the launcher"; exit 1; }

      - name: Upload the app
        if: always()
        shell: bash
        run: |
          [ -n "${PX_APP:-}" ] && ditto -c -k --keepParent "$PX_APP" pixel-player-simulator.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-app
          path: |
            pixel-player-simulator.zip
            simulator.png
            simulator-launcher.png
            simulator.log
            launcher.log
            roundtrip.log
